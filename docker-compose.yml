version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rtm_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: rtmdatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: rtm_redis
    ports:
      - "6379:6379"
    restart: always

  postgres_data:
